<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="كاميليا للإكسسوارات – أساور وخواتم وأقراط وسلاسل نسائية أنيقة في قصر الحيران، الأغواط.">
<title>CAMELIA – كاميليا للإكسسوارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f1e3;--ink:#2b1a1d;--wine:#4a0f1f;--gold:#b8912a;--gold2:#8a6d1c;--mut:#6b5a50;--ok:#2e8b57;--err:#c0392b;--line:#eadfc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#120a0c;z-index:30}
.dk{--gold:#d4af37;--gold2:#f1d77a;--mut:#c9b8a8;--ink:#faf5ea;color:var(--ink)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#120a0c;border-bottom:1px solid #3a2a2d}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 10px}
.hl{justify-self:start}.hr{justify-self:end;display:flex}
.hb{background:none;border:0;color:var(--gold2);width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.hb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
#cb{position:absolute;top:4px;left:2px;background:var(--gold);color:#000;border-radius:10px;font-size:11px;min-width:18px;display:none;justify-content:center;font-weight:700}
.logo{display:flex;flex-direction:column;align-items:center;color:var(--gold);line-height:1.1}
.logo span{font-family:Georgia,serif;letter-spacing:.28em;font-size:20px;font-weight:700}
.logo small{font-size:9px;letter-spacing:.3em;color:var(--mut)}
.drawer{display:none;padding:4px 16px 12px}.drawer.open{display:block}
.drawer a{display:block;padding:10px 4px;border-bottom:1px solid #2a1c1f}
main{max-width:980px;margin:0 auto;padding:12px 14px 20px;animation:f .35s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;background:#0b0507;border:1px solid #5a2a35;border-radius:16px;text-align:right}
.hero img{display:block;width:100%;height:auto}
.hero .ht{padding:16px 18px 22px;border-top:1px solid #5a2a35}
.hero h1{font-size:26px;color:var(--gold2);line-height:1.4}
.hero p{opacity:.85;margin:6px 0 14px}
@media(min-width:700px){.hero .ht{position:absolute;top:0;bottom:0;right:0;width:44%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 4%;border:0}.hero h1{font-size:clamp(28px,4.4vw,46px)}.hero p{font-size:clamp(13px,1.9vw,18px)}}
.trust{display:grid;grid-template-columns:repeat(3,1fr);background:#120a0c;border-radius:14px;margin:12px 0;padding:12px 6px;text-align:center;font-size:12px;gap:4px}
.trust svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.5;display:block;margin:0 auto 4px}
.btn{display:inline-block;background:linear-gradient(135deg,#f1d77a,#d4af37);color:#1a0e04;border:0;border-radius:24px;padding:10px 22px;font-weight:700;cursor:pointer;min-height:44px}
.btn.s{background:transparent;border:1px solid var(--gold);color:var(--wine)}
.btn[disabled]{opacity:.5}
h2{color:var(--wine);margin:22px 0 10px;font-size:20px}
.st{display:flex;align-items:center;gap:10px;margin:22px 0 12px;justify-content:center}
.st::before,.st::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.cts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ct{text-align:center;font-size:13px}
.cti{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#efe3c8;display:flex;align-items:center;justify-content:center;font-size:30px;color:#8a6d1c;margin-bottom:4px}
.cti img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--ink)}
.ph{aspect-ratio:1;background:#efe3c8;display:flex;align-items:center;justify-content:center;font-size:44px;color:#8a6d1c}
.ph img{width:100%;height:100%;object-fit:contain}
.ci{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.ci h3{font-size:15px}
.pr{color:#7a1230;font-weight:700}
.tag{position:absolute;top:8px;right:8px;background:var(--wine);color:#f1d77a;font-size:11px;padding:1px 8px;border-radius:10px}
.heart{position:absolute;top:6px;left:6px;background:#fffc;border:0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.card .btn{background:var(--wine);color:#f1d77a;font-size:13px;padding:6px 10px;min-height:38px;width:100%;margin-top:auto;border-radius:8px}
.op{color:#9a8a80;font-weight:400;font-size:13px}
.ph2{background:linear-gradient(120deg,#4a0f1f,#120a0c);border-radius:14px;padding:18px;color:#faf5ea;margin-bottom:12px}
.ph2 h1{color:#f1d77a;font-size:24px}.ph2 p{color:#c9b8a8}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chips a{white-space:nowrap;border:1px solid #d9c9a6;border-radius:20px;padding:2px 14px;background:#fff;font-size:14px}
.chips a.on{background:#120a0c;color:#f1d77a;border-color:#120a0c}
.bar{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:14px}
.bar input:first-child{grid-column:1/-1}
#fc{display:none}
input,select,textarea{background:#fff;border:1px solid #d9c9a6;border-radius:10px;padding:10px;width:100%;min-height:44px;color:var(--ink)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:none;cursor:pointer;color:var(--wine)}
.msg{text-align:center;color:var(--mut);padding:40px 10px}
.err{color:var(--err);font-size:13px}
.warn{background:#fdecea;border:1px solid var(--err);color:#7a1d14;border-radius:10px;padding:8px;font-size:14px;margin-top:8px}
.det{display:grid;gap:14px}
@media(min-width:700px){.det{grid-template-columns:1fr 1fr}}
.det .ph{border-radius:14px;font-size:90px}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;background:#efe3c8}
.ft3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;text-align:center;font-size:12px;color:var(--mut)}
.ft3 span{border:1px solid var(--line);border-radius:10px;padding:8px 2px;background:#fff}
.bn{position:relative;overflow:hidden;border-radius:16px;margin:22px 0;background:#0b0507;border:1px solid #5a2a35}
.bn img{display:block;width:100%;height:auto}
.bn .bt{padding:14px 16px 18px}
@media(min-width:700px){.bn .bt{position:absolute;top:0;bottom:0;left:0;width:48%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 4%}}
.bn h3{color:var(--gold2);font-size:20px}.bn p{margin:4px 0 12px;color:var(--mut)}
footer{background:#120a0c;margin-top:24px;padding:22px 14px;color:var(--mut);font-size:13px}
.fw{max-width:980px;margin:0 auto;display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:700px){.fw{grid-template-columns:repeat(3,1fr)}}
footer b{color:var(--gold2);display:block;margin-bottom:4px}footer a{display:block;padding:2px 0}
footer .lg{font-family:Georgia,serif;letter-spacing:.3em;color:var(--gold);font-size:20px}
.cp{text-align:center;margin-top:14px;border-top:1px solid #2a1c1f;padding-top:10px;font-size:12px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#d4af37;color:#000;padding:8px 18px;border-radius:20px;z-index:40;font-weight:700}
</style>
</head>

function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cart=ld("cm_cart",{}),fav=ld("cm_fav",[]),F={q:"",cat:"",sort:"new",max:""},form=ld("cm_form",{});
var $=function(s){return document.querySelector(s)};
function money(n){return n.toLocaleString("ar-DZ")+" "+CFG.currency}
function prod(id){return P.filter(function(p){return p.id===id})[0]}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},1500)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function count(){var n=0;for(var k in cart)n+=cart[k];return n}
function total(){var t=0;for(var k in cart){var p=prod(k);if(p&&p.price!=null)t+=p.price*cart[k]}return t}

function card(p){
  var img=p.thumb?'<img loading="lazy" src="'+esc(p.thumb)+'" alt="'+esc(p.name)+'">':"✦";
  var tag=oos(p)?"نفدت الكمية":p.sale?"عرض خاص":p.isNew?"جديد":"";
  return '<div class="card"><a href="#/p/'+p.id+'"><div class="ph">'+img+"</div></a>"+(tag?'<span class="tag">'+tag+"</span>":"")+
  '<button class="heart" aria-label="المفضلة" onclick="tf(\''+p.id+'\')">'+(fav.indexOf(p.id)>-1?"♥":"♡")+"</button>"+
  '<div class="ci"><h3>'+esc(p.name)+'</h3><small style="color:#7a6a5a">'+esc(p.ar||"")+'</small><div class="pr">'+pt(p)+"</div>"+
  '<button class="btn" '+(oos(p)?"disabled":"")+' onclick="add(\''+p.id+'\')">'+(oos(p)?"غير متوفر":"أضيفي للسلة")+"</button></div></div>";
}
function tf(id){var i=fav.indexOf(id);i>-1?fav.splice(i,1):fav.push(id);sv("cm_fav",fav);route()}
function add(id,n){var p=prod(id);if(!p||oos(p))return;var q=(cart[id]||0)+(n||1);if(q>p.stock){toast("الكمية المتوفرة "+p.stock+" فقط");q=p.stock}cart[id]=q;sv("cm_cart",cart);nav();toast("أُضيف إلى السلة")}
function chg(id,d){var p=prod(id),q=(cart[id]||0)+d;if(q<=0)delete cart[id];else if(q>p.stock){toast("الكمية المتوفرة "+p.stock+" فقط");return}else cart[id]=q;sv("cm_cart",cart);route()}
function del(id){delete cart[id];sv("cm_cart",cart);route()}

function fee(){return typeof CFG.deliveryFee==="number"&&CFG.deliveryFee>=0?CFG.deliveryFee:null}
function unp(){return Object.keys(cart).some(function(k){var p=prod(k);return p&&p.price==null})}

if(f!==null&&!u)h+='<div class="row"><b>المجموع النهائي</b><b style="color:var(--gold2)">'+money(total()+f)+'</b></div>';
return h+'</div>'}

fav:function(){var l=P.filter(function(p){return fav.indexOf(p.id)>-1});return "<h2>المفضلة</h2>"+(l.length?'<div class="grid">'+l.map(card).join("")+"</div>":'<div class="msg">لا توجد منتجات في المفضلة بعد.</div>')},
cart:function(){
  var ids=Object.keys(cart).filter(prod);
  if(!ids.length)return '<div class="msg">سلتكِ فارغة.<br><br><a class="btn" href="#/products">تصفّحي المنتجات</a></div>';
  return "<h2>السلة</h2>"+ids.map(function(id){var p=prod(id);return '<div class="box"><div class="row"><b>'+esc(p.name)+'</b><button class="q" style="background:none;border:0;color:var(--err)" onclick="del(\''+id+'\')">حذف</button></div><div class="row"><div class="q"><button onclick="chg(\''+id+'\',-1)">−</button><b>'+cart[id]+'</b><button onclick="chg(\''+id+'\',1)">+</button></div><span class="pr" style="color:var(--gold2)">'+(p.price==null?"السعر قريباً":money(p.price*cart[id]))+"</span></div></div>"}).join("")+summary()+'<a class="btn" href="#/checkout">إتمام الطلب</a>';
},
checkout:function(){
  if(!Object.keys(cart).filter(prod).length)return pages.cart();
  var f=form;
  return '<h2>إتمام الطلب</h2><div class="box"><label>الاسم الكامل</label><input id="n" value="'+esc(f.n||"")+'"><label>رقم الهاتف</label><input id="t" type="tel" inputmode="tel" value="'+esc(f.t||"")+'" placeholder="05XXXXXXXX"><label>البلدية</label><select id="m"><option value="in">'+CFG.area+'</option><option value="out"'+(f.m==="out"?" selected":"")+'>بلدية أخرى</option></select><div id="mw"></div><label>العنوان داخل '+CFG.area+'</label><textarea id="a" rows="2">'+esc(f.a||"")+'</textarea><label>ملاحظات التوصيل أو الطلب (اختياري)</label><textarea id="o" rows="2">'+esc(f.o||"")+'</textarea></div>'+summary()+'<div class="box" style="font-size:14px;color:var(--mut)">التوصيل داخل '+CFG.area+' فقط. الطلب لا يصبح مؤكدًا بمجرد فتح واتساب، بل بعد إرسال الرسالة وتواصل المحل معكِ.</div>'+(CFG.whatsapp?"":'<div class="warn">تنبيه إداري: رقم واتساب المحل غير مضبوط، لذلك زر الطلب معطّل.</div>')+'<div id="er" class="err"></div><button class="btn" id="send" '+(CFG.whatsapp?"":"disabled")+'>تأكيد الطلب عبر واتساب</button>';
},
p:function(id){
  var p=prod(id);if(!p)return '<div class="msg">المنتج غير موجود.</div>';
  var im=p.imgs&&p.imgs.length?p.imgs:(p.thumb?[p.thumb]:[]),big=im[0]?'<img id="gm" src="'+esc(im[0])+'" alt="'+esc(p.name)+'">':"✦";
  var th=im.length>1?'<div class="th">'+im.map(function(x){return '<img src="'+esc(x)+'" alt="" onclick="gs(this.src)">'}).join("")+"</div>":"";
  var st=oos(p)?'<span class="err">نفدت الكمية</span>':(p.stock>0?'<span style="color:var(--ok)">متوفر ('+p.stock+")</span>":"");
  return '<div class="det"><div><div class="ph">'+big+"</div>"+th+'</div><div><h2 style="margin-top:0">'+esc(p.name)+'</h2><div style="color:var(--mut)">'+esc(p.ar||"")+'</div><div class="pr" style="color:var(--gold2);font-size:22px">'+pt(p)+'</div><p style="color:var(--mut)">'+esc(p.desc||"")+"</p><p>"+CATS[p.cat]+(st?" · "+st:"")+(p.colors?"<br>الألوان: "+p.colors.join("، "):"")+(p.sizes?"<br>المقاسات: "+p.sizes.join("، "):"")+'</p><button class="btn" '+(oos(p)?"disabled":"")+' onclick="add(\''+p.id+'\')">أضيفي للسلة</button> <button class="btn s" onclick="tf(\''+p.id+'\')">'+(fav.indexOf(p.id)>-1?"♥ في المفضلة":"♡ المفضلة")+"</button><div class=\"ft3\"><span>تصميم أنيق</span><span>طلاء ذهبي</span><span>توصيل داخل "+CFG.area+"</span></div></div></div>";
},
info:function(){return '<h2>عن المحل والتواصل</h2><div class="box"><p>'+CFG.shopName+" – إكسسوارات نسائية أنيقة.</p><p>نطاق الخدمة حاليًا: <b>"+CFG.area+"، ولاية الأغواط</b> فقط.</p><p>للتواصل وإرسال الطلبات نستخدم واتساب.</p></div>"},
privacy:function(){return '<h2>الخصوصية وشروط الطلب</h2><div class="box"><p>• نستخدم بياناتكِ (الاسم، الهاتف، العنوان) فقط لمعالجة طلبكِ عبر واتساب، ولا نحفظها على أي خادم.</p><p>• يُحفظ محتوى السلة والمفضلة في متصفحكِ فقط.</p><p>• الطلب لا يُعتبر مؤكدًا إلا بعد ردّ المحل عليكِ عبر واتساب.</p><p>• الخدمة حاليًا داخل '+CFG.area+" فقط.</p></div>"},
admin:function(){return '<div class="msg">لوحة الإدارة غير مفعّلة في هذه المرحلة. حاليًا تُدار المنتجات عبر ملف المنتجات الذي أحدّثه لكِ.</div>'}
};
/* ===== منطق القائمة والطلب ===== */
function drawList(){
  var l=P.filter(function(p){
    return (!F.cat||p.cat===F.cat)&&(!F.q||(p.name+p.desc).indexOf(F.q)>-1)&&(!F.max||(p.price!=null&&p.price<=+F.max))});
  if(F.sort==="lo")l.sort(function(a,b){return (a.price==null?1e12:a.price)-(b.price==null?1e12:b.price)});
  else if(F.sort==="hi")l.sort(function(a,b){return (b.price==null?-1:b.price)-(a.price==null?-1:a.price)});
  else l.sort(function(a,b){return (b.isNew?1:0)-(a.isNew?1:0)});
  $("#list").innerHTML=l.length?'<div class="grid">'+l.map(card).join("")+"</div>":'<div class="msg">'+(P.length?"لا توجد منتجات مطابقة.":st())+'</div>';
}
function bindProducts(){
  $("#q").oninput=function(e){F.q=e.target.value.trim();drawList()};
  $("#fs").onchange=function(e){F.sort=e.target.value;drawList()};
  $("#fm").oninput=function(e){F.max=e.target.value;drawList()};
  $("#fc").onchange=function(e){location.hash="#/products"+(e.target.value?"/"+e.target.value:"")};
  drawList();
}
function bindCheckout(){
  function mw(){$("#mw").innerHTML=$("#m").value==="out"?'<div class="warn">عذرًا، خدمتنا حاليًا متاحة داخل '+CFG.area+' فقط.</div>':""}
  $("#m").onchange=mw;mw();
  $("#send").onclick=function(){
    var v=function(i){return $("#"+i).value.trim()};
    form={n:v("n"),t:v("t"),m:v("m"),a:v("a"),o:v("o")};sv("cm_form",form);
    var e="";
    if(form.n.length<3)e="أدخلي الاسم الكامل.";
    else if(!/^0[5-7]\d{8}$/.test(form.t.replace(/[\s.-]/g,"")))e="رقم الهاتف غير صحيح (مثال: 0550000000).";
    else if(form.m==="out")e="الخدمة متاحة داخل "+CFG.area+" فقط.";
    else if(form.a.length<4)e="أدخلي العنوان أو نقطة الاستلام.";
    else if(!Object.keys(cart).filter(prod).length)e="السلة فارغة.";
    else if(!CFG.whatsapp)e="رقم واتساب المحل لم يُضبط بعد، لا يمكن إرسال الطلب حاليًا.";
    $("#er").textContent=e;if(e)return;
    var L=["طلب جديد – "+CFG.shopName,"",""];
    Object.keys(cart).forEach(function(id){var p=prod(id);if(p)L.push("• "+p.name+" × "+cart[id]+(p.price==null?" – السعر يُؤكَّد":" – "+money(p.price)+" للقطعة = "+money(p.price*cart[id])))});
    var UN=unp();L.push("",hasPr()?(UN?"مجموع المنتجات المسعّرة: ":"المجموع الفرعي: ")+money(total()):"المجموع: يُؤكَّد عبر واتساب");if(UN)L.push("ملاحظة: سعر بعض المنتجات يحتاج تأكيدًا.");if(fee()!==null){L.push("التوصيل: "+money(fee()));if(!UN)L.push("المجموع النهائي: "+money(total()+fee()))}else L.push("التوصيل: تكلفة التوصيل تُؤكَّد عبر واتساب");L.push("","الاسم: "+form.n,"الهاتف: "+form.t,"عنوان التوصيل: "+form.a+"، "+CFG.area);
    if(form.o)L.push("ملاحظات: "+form.o);
    window.open("https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent(L.join("\n")),"_blank");
  };
}
/* ===== التوجيه ===== */
function route(){
  var h=(location.hash||"#/").slice(2).split("/"),r=h[0]||"home",a=$("#app");
  if(!pages[r]){r="home"}
  try{a.innerHTML=pages[r](h[1])}catch(e){a.innerHTML='<div class="msg">حدث خطأ، حاولي تحديث الصفحة.</div>'}
  if(r==="products")bindProducts();
  if(r==="p"){var pp=prod(h[1]);if(pp&&!pp.full&&window.loadImgs){pp.full=1;window.loadImgs(pp.id).then(function(l){if(l&&l.length){pp.imgs=l;if((location.hash||"").indexOf(pp.id)>-1){a.innerHTML=pages.p(pp.id);nav()}}}).catch(function(){})}}
  if(r==="checkout")bindCheckout();
  nav();
  $("#drawer").className="drawer";document.title="CAMELIA – كاميليا للإكسسوارات";
}
window.addEventListener("hashchange",function(){route();window.scrollTo(0,0)});
route();
</script>
