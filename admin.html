<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة CAMELIA</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:#120a0c;color:#faf5ea;font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7;padding:14px;max-width:640px;margin:0 auto}
h1{color:#d4af37;font-size:20px}h2{color:#d4af37;font-size:17px;margin:20px 0 8px}
.b{background:#2a0a13;border:1px solid #4a2a33;border-radius:14px;padding:12px;margin:10px 0}
.r{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
label{display:block;margin-top:10px;font-size:14px;color:#b9a99b}
label.k{display:flex;gap:8px;align-items:center;color:#faf5ea}
input,select,textarea{width:100%;background:#1e1215;border:1px solid #4a3a3d;border-radius:10px;padding:10px;color:#faf5ea;font:inherit;min-height:44px}
input[type=checkbox]{width:22px;min-height:22px}
button{background:#1e1215;border:1px solid #d4af37;color:#f1d77a;border-radius:22px;padding:8px 16px;font:inherit;min-height:44px;cursor:pointer}
button.g{background:linear-gradient(135deg,#f1d77a,#d4af37);color:#1a0e04;border:0;font-weight:700}
button.d{border-color:#e0584f;color:#e0584f}
button.w{width:100%;margin-top:10px}
img.t{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#efe3c8}
.mu{color:#b9a99b;font-size:13px}
.tg{background:#4a0f1f;border-radius:10px;padding:0 8px;font-size:12px}
.m{padding:8px;border-radius:10px;margin:8px 0}.ok{background:#12301f;color:#7fe0a8}.bad{background:#3a1a10;color:#ff9c94}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,collection,doc,getDocs,getDoc,setDoc,updateDoc,writeBatch} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const fbApp=initializeApp({apiKey:"AIzaSyDkaYA3c6dch3z9xRtZ2C8cTGDRQG5zvvk",authDomain:"camelia-2491e.firebaseapp.com",projectId:"camelia-2491e",storageBucket:"camelia-2491e.firebasestorage.app",messagingSenderId:"6705542849",appId:"1:6705542849:web:6b5b9314b05504955dc640"});
const auth=getAuth(fbApp),db=getFirestore(fbApp);
const CATS={sets:"الأطقم",bracelets:"الأساور",rings:"الخواتم",earrings:"الأقراط",chains:"السلاسل والقلائد"};
const $=s=>document.querySelector(s),root=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let user=null,list=[],ed=null,msg="",settings={};
const say=(t,bad)=>{msg=t?`<div class="m ${bad?"bad":"ok"}">${esc(t)}</div>`:"";const e=$("#msg");if(e)e.innerHTML=msg};
const perr=e=>e&&e.code==="permission-denied"?"هذا الحساب غير مصرّح له. تحقّقي من قواعد الأمان ومن UID.":"حدث خطأ: "+((e&&(e.code||e.message))||"");
async function comp(file,max){const bm=await createImageBitmap(file),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);let u=c.toDataURL("image/webp",.72);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/jpeg",.75);return u}
const imgsHtml=()=>ed.imgs.map((s,i)=>`<div class="r"><img class="t" src="${s}" alt=""><span>${i?"":"★ الرئيسية"}</span><button onclick="A.mv(${i},-1)">↑</button><button onclick="A.mv(${i},1)">↓</button><button class="d" onclick="A.rm(${i})">حذف</button></div>`).join("")||'<p class="mu">لا توجد صور بعد.</p>';
const card=p=>`<div class="b"><div class="r"><img class="t" src="${esc(p.thumb||"")}" alt=""><div style="flex:1"><b>${esc(p.name)}</b><div class="mu">${esc(p.ar||"")} · ${CATS[p.cat]||""}</div><div>${p.price==null?"السعر قريباً":esc(p.price)+" دج"}</div><div>${p.visible?"":'<span class="tg">مخفي</span> '}${p.avail===false?'<span class="tg">نفد</span>':""}</div></div></div><div class="r"><button onclick="A.edit('${p.id}')">تعديل</button><button onclick="A.vis('${p.id}',${!p.visible})">${p.visible?"إخفاء":"إظهار"}</button><button class="d" onclick="A.del('${p.id}')">حذف</button></div></div>`;
const settingsHtml=()=>`<h2>إعدادات المتجر</h2><div class="b"><label>رقم واتساب بالصيغة الدولية بدون + (مثال: 2135XXXXXXXX)</label><input id="wa" inputmode="numeric" value="${esc(settings.whatsapp||"")}"><label>سعر التوصيل بالدينار (فارغ = يُؤكَّد عبر واتساب)</label><input id="df" type="number" inputmode="numeric" min="0" value="${settings.deliveryFee??""}"><button class="g w" onclick="A.setSave()">حفظ الإعدادات</button></div><p class="mu">UID الحساب: ${esc(user.uid)}</p>`;
function draw(){
  if(!user){root.innerHTML=`<h1>CAMELIA – الإدارة</h1><div class="b"><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username"><label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password"><div id="msg">${msg}</div><button class="g w" onclick="A.login()">دخول</button></div>`;return}
  if(ed){drawForm();return}
  root.innerHTML=`<div class="r"><h1 style="flex:1">المنتجات</h1><button onclick="A.out()">خروج</button></div><div id="msg">${msg}</div><button class="g w" onclick="A.add()">+ إضافة منتج جديد</button>`+(list.length?list.map(card).join(""):'<p class="mu">لا توجد منتجات بعد.</p>')+settingsHtml();
}
function drawForm(){const f=ed.f;root.innerHTML=`<h1>${ed.id?"تعديل منتج":"منتج جديد"}</h1><div class="b">
<label>اسم المنتج (فرنسي) *</label><input id="n" value="${esc(f.name)}">
<label>الاسم بالعربية</label><input id="a" value="${esc(f.ar)}">
<label>التصنيف</label><select id="c">${Object.keys(CATS).map(k=>`<option value="${k}" ${f.cat===k?"selected":""}>${CATS[k]}</option>`).join("")}</select>
<label>السعر بالدينار (فارغ = السعر قريباً)</label><input id="p" type="number" inputmode="numeric" min="0" value="${f.price??""}">
<label>الوصف (اختياري)</label><textarea id="d" rows="3">${esc(f.desc)}</textarea>
<label>الكمية المتوفرة (اختياري)</label><input id="s" type="number" inputmode="numeric" min="0" value="${f.stock??""}">
<label class="k"><input type="checkbox" id="av" ${f.avail!==false?"checked":""}> متوفر</label>
<label class="k"><input type="checkbox" id="vi" ${f.visible!==false?"checked":""}> ظاهر في المتجر</label>
<label class="k"><input type="checkbox" id="nw" ${f.isNew?"checked":""}> جديد</label>
<label class="k"><input type="checkbox" id="sl" ${f.sale?"checked":""}> عرض خاص</label>
<label>الصور (الأولى هي الرئيسية)</label><div id="im">${imgsHtml()}</div>
<input id="fi" type="file" accept="image/*" multiple hidden onchange="A.pick(this)"><button onclick="document.getElementById('fi').click()">رفع الصور</button>
<div id="msg">${msg}</div><button class="g w" onclick="A.save()">حفظ المنتج</button><button class="w" onclick="A.back()">رجوع</button></div>`}
async function load(){try{const s=await getDocs(collection(db,"products"));list=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));const c=await getDoc(doc(db,"settings","store"));settings=c.exists()?c.data():{}}catch(e){say(perr(e),1)}draw()}
const g=i=>document.getElementById(i);
window.A={
async login(){say("");try{await signInWithEmailAndPassword(auth,g("em").value.trim(),g("pw").value)}catch(e){say("البريد أو كلمة السر غير صحيحة.",1)}},
out(){signOut(auth)},
add(){ed={id:null,f:{},imgs:[]};say("");draw()},
async edit(id){const p=list.find(x=>x.id===id);ed={id,f:p,imgs:[]};say("");try{const d=await getDoc(doc(db,"productImages",id));ed.imgs=d.exists()?d.data().list:[]}catch(e){}draw()},
back(){ed=null;say("");load()},
async pick(inp){const fs=[...inp.files];say("جارٍ تجهيز الصور...");try{for(const f of fs){if(ed.imgs.length>=6){say("الحد الأقصى 6 صور لكل منتج.",1);break}ed.imgs.push(await comp(f,800))}if(ed.imgs.length<6)say("")}catch(e){say("تعذّر تجهيز إحدى الصور.",1)}inp.value="";$("#im").innerHTML=imgsHtml()},
mv(i,d){const j=i+d;if(j<0||j>=ed.imgs.length)return;[ed.imgs[i],ed.imgs[j]]=[ed.imgs[j],ed.imgs[i]];$("#im").innerHTML=imgsHtml()},
rm(i){ed.imgs.splice(i,1);$("#im").innerHTML=imgsHtml()},
async save(){
  const name=g("n").value.trim(),pr=g("p").value.trim(),st=g("s").value.trim();
  if(name.length<2)return say("اكتبي اسم المنتج.",1);
  if(pr!==""&&!(+pr>=0))return say("السعر غير صحيح.",1);
  if(st!==""&&!(Number.isInteger(+st)&&+st>=0))return say("الكمية غير صحيحة.",1);
  if(JSON.stringify(ed.imgs).length>900000)return say("الصور كبيرة جدًا، احذفي بعضها.",1);
  say("جارٍ الحفظ...");
  try{
    const ref=ed.id?doc(db,"products",ed.id):doc(collection(db,"products"));
    const o={name,ar:g("a").value.trim(),cat:g("c").value,price:pr===""?null:+pr,desc:g("d").value.trim(),avail:g("av").checked,visible:g("vi").checked,isNew:g("nw").checked,sale:g("sl").checked,created:ed.f.created||Date.now(),updated:Date.now(),thumb:ed.imgs[0]?await comp(await (await fetch(ed.imgs[0])).blob(),360):""};
    if(st!=="")o.stock=+st;
    const b=writeBatch(db);b.set(ref,o);b.set(doc(db,"productImages",ref.id),{list:ed.imgs});await b.commit();
    ed=null;say("تم حفظ المنتج بنجاح ✓");await load();
  }catch(e){say(perr(e),1)}
},
async vis(id,v){try{await updateDoc(doc(db,"products",id),{visible:v});await load()}catch(e){say(perr(e),1)}},
async del(id){if(!confirm("هل تريدين حذف هذا المنتج نهائيًا؟"))return;try{const b=writeBatch(db);b.delete(doc(db,"products",id));b.delete(doc(db,"productImages",id));await b.commit();say("تم الحذف.");await load()}catch(e){say(perr(e),1)}},
async setSave(){const w=g("wa").value.replace(/\D/g,""),d=g("df").value.trim();if(w&&!/^\d{10,15}$/.test(w))return say("رقم واتساب غير صحيح.",1);if(d!==""&&!(+d>=0))return say("سعر التوصيل غير صحيح.",1);const v={whatsapp:w,deliveryFee:d===""?null:+d};try{await setDoc(doc(db,"settings","store"),v);settings=v;say("تم حفظ الإعدادات ✓")}catch(e){say(perr(e),1)}}
};
onAuthStateChanged(auth,u=>{user=u;ed=null;if(u)load();else draw()});
draw();
</script>
</body>
</html>
